<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Vidéo verticale avec sous-titres</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #101318;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #f4f7f6;
      }
      #backdrop {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        background: linear-gradient(180deg, #191e26 0%, #101318 60%, #0b3b37 100%);
      }
      #orb {
        position: absolute;
        left: 190px;
        top: 360px;
        width: 700px;
        height: 700px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 168, 150, 0.55), rgba(0, 168, 150, 0) 70%);
      }
      #kicker {
        position: absolute;
        left: 90px;
        top: 220px;
        width: 900px;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #00a896;
      }
      #headline {
        position: absolute;
        left: 90px;
        top: 290px;
        width: 900px;
        font-size: 110px;
        font-weight: 900;
        line-height: 1.02;
        letter-spacing: -0.03em;
      }
      #captions {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1920"
    >
      <div id="backdrop" class="clip" data-start="0" data-duration="12" data-track-index="0"></div>
      <div id="orb" class="clip" data-start="0" data-duration="12" data-track-index="1"></div>
      <div id="kicker" class="clip" data-start="0" data-duration="12" data-track-index="2">Astuce vidéo</div>
      <h1 id="headline" class="clip" data-start="0" data-duration="12" data-track-index="3">Format vertical : les bons réflexes</h1>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/sous-titres.html"
        data-start="0"
        data-duration="12"
        data-track-index="4"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#orb", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0);
      tl.to("#orb", { y: 120, duration: 10, ease: "sine.inOut" }, 1.2);
      tl.fromTo("#kicker", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
      tl.fromTo("#headline", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
