<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Motion design typographique</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #101318;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #f4f7f6;
      }
      .word {
        position: absolute;
        left: 0;
        width: 1920px;
        text-align: center;
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      #word-1 {
        top: 380px;
        font-size: 260px;
      }
      #word-2 {
        top: 380px;
        font-size: 260px;
        color: #00a896;
      }
      #word-3 {
        top: 380px;
        font-size: 260px;
        color: #ff6b35;
      }
      #highlight {
        position: absolute;
        left: 360px;
        top: 600px;
        width: 1200px;
        height: 36px;
        background: #ff6b35;
      }
      #typed {
        position: absolute;
        left: 360px;
        top: 440px;
        width: 1200px;
        font-size: 120px;
        font-weight: 800;
        white-space: nowrap;
        letter-spacing: -0.02em;
      }
      #signature {
        position: absolute;
        left: 0;
        top: 880px;
        width: 1920px;
        text-align: center;
        font-size: 34px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #a7b2c2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="word-1" class="word clip" data-start="0" data-duration="1.8" data-track-index="0">Écrire.</div>
      <div id="word-2" class="word clip" data-start="1.8" data-duration="1.8" data-track-index="1">Animer.</div>
      <div id="word-3" class="word clip" data-start="3.6" data-duration="1.8" data-track-index="2">Raconter.</div>
      <div id="highlight" class="clip" data-start="5.4" data-duration="4.6" data-track-index="3"></div>
      <div id="typed" class="clip" data-start="5.4" data-duration="4.6" data-track-index="4">Vos idées en mouvement</div>
      <div id="signature" class="clip" data-start="6.8" data-duration="3.2" data-track-index="5">Hyperframes Creator</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#word-1", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0);
      tl.to("#word-1", { opacity: 0, y: -120, duration: 0.4, ease: "expo.in" }, 1.4);
      tl.fromTo("#word-2", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 1.8);
      tl.to("#word-2", { opacity: 0, scale: 0.7, duration: 0.4, ease: "expo.in" }, 3.2);
      tl.fromTo("#word-3", { opacity: 0, x: -300 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, 3.6);
      tl.to("#word-3", { opacity: 0, x: 300, duration: 0.4, ease: "expo.in" }, 5);

      // Machine à écrire : une découpe qui avance par paliers, seekable à toute image.
      tl.fromTo("#typed", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.6, ease: "steps(22)" }, 5.5);
      tl.fromTo("#highlight", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.inOut", transformOrigin: "0% 50%" }, 7.2);
      tl.fromTo("#signature", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 7.4);
      tl.to("#typed", { y: -10, duration: 2, ease: "sine.inOut" }, 8);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
