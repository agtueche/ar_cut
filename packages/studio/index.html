<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/ar-cut-logo.png" />
    <title>Ar cut</title>
    <script>
      // Before the first paint: the theme the toggle saved, else Creator's dark palette
      // (owner: src/utils/studioTheme.ts).
      try {
        if (JSON.parse(localStorage.getItem("hf-studio-ui-preferences") || "{}").theme === "light")
          document.documentElement.dataset.theme = "paper";
      } catch (e) {
        // Storage unavailable: stay on the dark default.
      }
    </script>
  </head>
  <body>
    <div data-hf-id="hf-aph5" id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
